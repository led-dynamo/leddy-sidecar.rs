[package]
org = "led-dynamo"
name = "leddy-sidecar"
version = "0.1.0"
description = "k8s sidecar for LED Dynamo."
license = "MIT"
keywords = ["sidecar", "observability", "k8s"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/led-dynamo/leddy-sidecar.rs"

[dependencies]
"ores-otel/ores-otel-sidecar" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin leddy-sidecar"
outputs = ["target/release/leddy-sidecar"]

[bin]
leddy-sidecar = "target/release/leddy-sidecar"

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
